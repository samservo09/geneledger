[project]
name = "geneledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samantha Servo", email = "samanthaservo09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[project.scripts]
geneledger = "geneledger:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
